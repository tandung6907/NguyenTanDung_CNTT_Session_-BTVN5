<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trang Web của TanDung</title>
  </head>
  <body>
    <h1>Danh sách sản phẩm chợ tết</h1>
    <ul id="product-list">
      <!-- Danh sách sản phẩm -->
    </ul>
    <form id="product-form">
      <input type="text" id="product-name" placeholder="Tên sản phẩm" />
      <input type="number" id="product-price" min="0" placeholder="Giá (VND)" />
      <input type="text" id="search-input" placeholder="Tìm sản phẩm..." />
      <button type="">Thêm Sản Phẩm Khác</button>
    </form>
    <p id="not-found" style="display: none; color: red">
      Không tìm thấy sản phẩm
    </p>
    <div class="sort-controls">
      <button type="submit" id="sort-asc">Sắp xếp giá: Thấp -> Cao</button>
      <button type="submit" id="sort-desc">Sắp xếp giá: Cao -> Thấp</button>
    </div>

  </body>
</html>
